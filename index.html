<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopEasy - Retail Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">🛍️ ShopEasy</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="cart-btn" onclick="toggleCart()">
      🛒 Cart <span id="cart-count">0</span>
    </button>
  </header>

  <!-- Hero -->
  <section class="hero" id="home">
    <h1>Welcome to ShopEasy</h1>
    <p>Quality products at unbeatable prices</p>
    <a href="#products" class="btn">Shop Now</a>
  </section>

  <!-- Products -->
  <section class="products-section" id="products">
    <h2>Our Products</h2>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterProducts('all', this)">All</button>
      <button class="filter-btn" onclick="filterProducts('electronics', this)">Electronics</button>
      <button class="filter-btn" onclick="filterProducts('clothing', this)">Clothing</button>
      <button class="filter-btn" onclick="filterProducts('home', this)">Home</button>
    </div>
    <div class="product-grid" id="product-grid"></div>
  </section>

  <!-- Contact -->
  <section class="contact" id="contact">
    <h2>Contact Us</h2>
    <form onsubmit="handleContact(event)">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Your Message" rows="4" required></textarea>
      <button type="submit" class="btn">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2024 ShopEasy. All rights reserved.</p>
  </footer>

  <!-- Cart Sidebar -->
  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p class="empty-cart">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <p>Total: <strong id="cart-total">$0.00</strong></p>
      <button class="btn" onclick="checkout()">Checkout</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
